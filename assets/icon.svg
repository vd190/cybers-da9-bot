<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#16124a"/>
      <stop offset="0.55" stop-color="#0a0b24"/>
      <stop offset="1" stop-color="#030409"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#b43cff"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#9ff8ff"/>
      <stop offset="1" stop-color="#00c8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2a3a8a" stroke-width="1" opacity="0.35"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0.3" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gm"><rect width="1024" height="1024" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)" mask="url(#gm)"/>

  <!-- circuit traces -->
  <g stroke="url(#neon)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85" filter="url(#soft)">
    <path d="M140 380 H250 L300 330 H360"/>
    <path d="M140 640 H250 L300 690 H360"/>
    <path d="M884 380 H774 L724 330 H664"/>
    <path d="M884 640 H774 L724 690 H664"/>
    <path d="M512 120 V170"/>
    <path d="M512 854 V904"/>
  </g>
  <g fill="#00f0ff" filter="url(#soft)">
    <circle cx="140" cy="380" r="11"/><circle cx="140" cy="640" r="11"/>
    <circle cx="884" cy="380" r="11" fill="#b43cff"/><circle cx="884" cy="640" r="11" fill="#b43cff"/>
    <circle cx="512" cy="120" r="11"/><circle cx="512" cy="904" r="11" fill="#b43cff"/>
  </g>

  <!-- hexagon frame -->
  <polygon points="512,170 808,341 808,683 512,854 216,683 216,341"
           fill="#070818" fill-opacity="0.75" stroke="url(#neon)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="512,214 770,363 770,661 512,810 254,661 254,363"
           fill="none" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>

  <!-- CYBERS -->
  <text x="512" y="420" text-anchor="middle" font-family="Bahnschrift" font-weight="700"
        font-size="74" letter-spacing="16" fill="#d9fbff" filter="url(#soft)">CYBERS</text>
  <rect x="352" y="446" width="320" height="5" rx="2.5" fill="url(#neon)"/>

  <!-- DA9 -->
  <text x="512" y="632" text-anchor="middle" font-family="Segoe UI Black" font-weight="900"
        font-size="196" letter-spacing="4" fill="url(#txt)" filter="url(#glow)" opacity="0.9">DA9</text>
  <text x="512" y="632" text-anchor="middle" font-family="Segoe UI Black" font-weight="900"
        font-size="196" letter-spacing="4" fill="url(#txt)">DA9</text>

  <!-- small tag -->
  <text x="512" y="712" text-anchor="middle" font-family="Bahnschrift" font-weight="600"
        font-size="34" letter-spacing="12" fill="#b43cff" opacity="0.95">STORE</text>
</svg>
